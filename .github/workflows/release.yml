name: Build Gem

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build gem
        run: gem build kitchen-provisioner-ice-temp.gemspec

      # RubyGems publishing is disabled for now.
      # To re-enable, uncomment the steps below and add:
      #   permissions: id-token: write
      #   environment: release
