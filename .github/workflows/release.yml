name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build gem
        run: gem build kitchen-provisioner-chef-ice.gemspec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: kitchen-provisioner-chef-ice-*.gem
          generate_release_notes: true
